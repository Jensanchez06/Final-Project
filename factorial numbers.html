<!DOCTYPE html>
<head>
	
  <title>Factorial Numbers</title>
</head>
<body>

<p>Enter a number.</p>
<input type="number" id="num1">
<button onclick="add()">=</button>
<section>
<p>Factorial of given number is:</p>
<h2 id="result"></h2>

<script>
function add(){
let n = +num1.value;
let fact = 1;
let n1 = 1;

while(n1 <= n){
fact *= n1;
n1++;
}

let resultElement = document.getElementById('result');
resultElement.textContent = fact;
}
</script>
