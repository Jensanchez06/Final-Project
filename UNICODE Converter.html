<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicode Converter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e8f1f5;
            margin: 0;
            padding: 15px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #164E63;
            font-size: 28px;
            margin-bottom: 15px;
        }

        /* Pictures */
        .pictures {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .pictures img {
            width: 230px;
            height: 160px;
            object-fit: contain;
            background-color: white;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 3px;
        }

        /* Input box */
        .input-box {
            background-color: white;
            border: 1px solid #444;
            border-radius: 7px;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
        }

        .input-box h2 {
            margin: 0 0 8px;
            color: #164E63;
            font-size: 18px;
        }

        input {
            width: 220px;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        button {
            padding: 8px 15px;
            margin-left: 5px;
            font-size: 14px;
            background-color: #0F766E;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #164E63;
        }

        /* Smaller Output box */
        .output {
            background-color: white;
            border: 1px solid #444;
            border-radius: 7px;
            padding: 10px;
            text-align: center;
            max-width: 350px;
            margin: auto;
        }

        .output h2 {
            background-color: #164E63;
            color: white;
            font-size: 16px;
            padding: 6px;
            margin: -10px -10px 10px;
            border-radius: 6px 6px 0 0;
        }

        /* Graphic Character Symbol */
        .result-box {
            width: 180px;
            margin: auto;
        }

        .result-box h3 {
            color: #0F766E;
            font-size: 14px;
            margin: 5px;
        }

        #symbol {
            font-size: 45px;
            min-height: 50px;
        }

        #message {
            font-size: 13px;
            font-weight: bold;
        }

        @media (max-width: 650px) {

            .pictures {
                flex-wrap: wrap;
            }

            .pictures img {
                width: 200px;
                height: 140px;
            }

            button {
                margin-top: 7px;
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Unicode Converter</h1>

    <!-- YOUR THREE PICTURES -->
    <div class="pictures">

        <p>
            <img src="uni1.jpg" alt="Unicode example 1">
        </p>

        <p>
            <img src="uni2.jpg" alt="Unicode example 2">
        </p>

        <p>
            <img src="uni3.jpg" alt="Unicode example 3">
        </p>

    </div>

    <!-- ENTER UNICODE NUMBER -->
    <div class="input-box">

        <h2>Enter Unicode Number</h2>

        <input
            type="text"
            id="unicodeInput"
            placeholder="Example: 0041"
        >

        <button onclick="convertUnicode()">Convert</button>

    </div>

    <!-- OUTPUT -->
    <div class="output">

        <h2>Output</h2>

        <div class="result-box">

            <h3>Graphic Character Symbol</h3>

            <div id="symbol"></div>

        </div>

        <p id="message"></p>

    </div>

</div>

<script>

function convertUnicode() {

    let value = document.getElementById("unicodeInput").value.trim();

    let symbol = document.getElementById("symbol");
    let message = document.getElementById("message");

    symbol.textContent = "";
    message.textContent = "";

    value = value.replace(/^0x/i, "");

    if (!/^[0-9A-Fa-f]{1,6}$/.test(value)) {

        message.textContent =
            "Please enter a valid Unicode number.";

        return;
    }

    let number = parseInt(value, 16);

    if (
        number > 0x10FFFF ||
        (number >= 0xD800 && number <= 0xDFFF)
    ) {

        message.textContent =
            "That Unicode value is invalid.";

        return;
    }

    symbol.textContent = String.fromCodePoint(number);

    message.textContent = "Conversion successful!";
}

</script>

</body>
</html>
