<!DOCTYPE html>
<html>

<head>

    <title>AND Gate</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container {
            background-color: white;
            width: 700px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
        }

        button {
            padding: 15px 25px;
            margin: 10px;
            font-size: 18px;
            background-color: #35424a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        #result {
            font-size: 25px;
            font-weight: bold;
            margin: 20px;
        }

        .gate {
            margin-top: 30px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #35424a;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>AND Gate</h1>

    <p>
        Click an input combination to see the output.
    </p>


    <!-- BUTTONS -->

    <button onclick="showResult(0, 0)">
        0 AND 0
    </button>

    <button onclick="showResult(0, 1)">
        0 AND 1
    </button>

    <br>

    <button onclick="showResult(1, 0)">
        1 AND 0
    </button>

    <button onclick="showResult(1, 1)">
        1 AND 1
    </button>


    <!-- RESULT -->

    <div id="result">
        Output: -
    </div>


    <!-- AND GATE -->

    <h2>AND Gate Illustration</h2>

    <div class="gate">

        <svg width="600" height="300">

            <!-- Input A wire -->

            <line x1="80" y1="80"
                  x2="220" y2="80"
                  stroke="black"
                  stroke-width="5"/>


            <!-- Input B wire -->

            <line x1="80" y1="200"
                  x2="220" y2="200"
                  stroke="black"
                  stroke-width="5"/>


            <!-- AND Gate -->

            <path d="
                M220 50
                L320 50
                C430 50 430 230 320 230
                L220 230
                Z"
                fill="white"
                stroke="black"
                stroke-width="5"/>


            <!-- Output wire -->

            <line x1="430" y1="140"
                  x2="550" y2="140"
                  stroke="black"
                  stroke-width="5"/>


            <!-- Input A number -->

            <text id="numberA"
                  x="45"
                  y="88"
                  font-size="28"
                  font-weight="bold">
                -
            </text>


            <!-- Input B number -->

            <text id="numberB"
                  x="45"
                  y="208"
                  font-size="28"
                  font-weight="bold">
                -
            </text>


            <!-- Output number -->

            <text id="numberOutput"
                  x="510"
                  y="130"
                  font-size="28"
                  font-weight="bold">
                -
            </text>


            <!-- A and B labels -->

            <text x="25"
                  y="55"
                  font-size="18">
                A
            </text>

            <text x="25"
                  y="175"
                  font-size="18">
                B
            </text>


            <!-- AND -->

            <text x="270"
                  y="150"
                  font-size="25"
                  font-weight="bold">
                AND
            </text>


            <!-- OUTPUT -->

            <text x="475"
                  y="110"
                  font-size="18">
                Output
            </text>

        </svg>

    </div>


    <p>
        <b>AND Gate Rule:</b>
        Both inputs must be 1 for the output to be 1.
    </p>


    <!-- BACK TO PROJECTS -->

    <a href="projects.html" class="back">
        ← Back to Projects
    </a>

</div>


<script>

    function showResult(A, B) {

        // Calculate the AND output

        let output;

        if (A == 1 && B == 1) {

            output = 1;

        } else {

            output = 0;

        }


        // Show the result

        document.getElementById("result").innerHTML =
            "Output: " + output;


        // Put the numbers on the AND gate

        document.getElementById("numberA").textContent = A;

        document.getElementById("numberB").textContent = B;

        document.getElementById("numberOutput").textContent = output;

    }

</script>


</body>

</html>
